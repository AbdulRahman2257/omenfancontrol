# readme.yml
# Runs after CI passes on push to main.
# Updates version, updated, and tests badges in README.md.
# Commits with [skip ci] to avoid triggering another CI run.

name: Update README

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  update-badges:
    name: Update README badges
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read version from pyproject.toml
        id: version
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print('version=' + data['project']['version'])
          " >> $GITHUB_OUTPUT

      - name: Update README badges
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path
          from datetime import date

          readme = Path("README.md").read_text()
          version = "${{ steps.version.outputs.version }}"
          today   = date.today().isoformat()
          repo    = "${{ github.repository }}"

          # version badge — links to releases page
          readme = re.sub(
              r'\[!\[version\]\(.*?\)\]\(.*?\)',
              f'[![version](https://img.shields.io/badge/version-{version}-f97316?style=flat-square&labelColor=1e1810)](https://github.com/{repo}/releases)',
              readme,
          )

          # updated badge — date uses double hyphens so shields.io parses correctly
          today_escaped = today.replace("-", "--")
          readme = re.sub(
              r'\[!\[updated\]\(.*?\)\]\(.*?\)',
              f'[![updated](https://img.shields.io/badge/updated-{today_escaped}-3d2f1a?style=flat-square&labelColor=1e1810)]()',
              readme,
          )

          # tests badge — live status from CI
          readme = re.sub(
              r'\[!\[tests\]\(.*?\)\]\(.*?\)',
              f'[![tests](https://github.com/{repo}/actions/workflows/ci.yml/badge.svg)](https://github.com/{repo}/actions/workflows/ci.yml)',
              readme,
          )

          Path("README.md").write_text(readme)
          print(f"README updated — version={version} date={today}")
          EOF

      - name: Commit updated README
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update README badges [skip ci]"
          git push